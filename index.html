<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Openspacemarin</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      /* Fixed 640×480 game window, centred on the page */
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d0d1a;
      }

      #game-window {
        position: relative;
        width: 640px;
        height: 480px;
        flex-shrink: 0;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.8);
        border: 1px solid #222244;
      }

      #game-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 640px;
        height: 480px;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      #ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 640px;
        height: 480px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-window">
        <canvas id="game-canvas" width="640" height="480"></canvas>
        <div id="ui-overlay"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
